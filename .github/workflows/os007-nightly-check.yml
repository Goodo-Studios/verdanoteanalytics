name: OS-007 nightly ClickUp check (staging)

on:
  schedule:
    - cron: "30 10 * * *" # 10:30 UTC = 02:30 Pacific (standard time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os007-nightly-check
  cancel-in-progress: false

jobs:
  nightly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: staging
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run nightly comparison against staging
        id: check
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/os007"
          node scripts/os007-nightly-check.mjs | tee "$RUNNER_TEMP/os007/result.json"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### OS-007 nightly check (staging)"
            echo '```json'
            cat "$RUNNER_TEMP/os007/result.json" 2>/dev/null || echo '{"error":"no result produced"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os007-nightly-result
          path: ${{ runner.temp }}/os007/result.json
          if-no-files-found: warn
          retention-days: 30
