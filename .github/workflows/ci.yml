name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      # Root tsconfig.json is a solution file ("files": [] + project references),
      # so a bare `tsc --noEmit` checks nothing and always exits 0. Point tsc at
      # each real project so the gate actually inspects the code.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json

      - name: Test
        run: npm run test

  # The supabase/functions/**/*.test.ts suites are Deno, and vitest only collects
  # src/** (see vitest.config.ts `include`) — so until this job existed, 37 test
  # files never ran anywhere, including the edge-function auth/tenant regression
  # tests. Runs with --no-check: these modules use Deno URL imports that tsc
  # cannot resolve, and type checking is already covered by the `check` job.
  deno-test:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Test edge functions
        run: deno test --allow-all --no-check supabase/functions/

  database-test:
    name: Database migrations & pgTAP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Apply migrations from a clean database
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db --local

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E tests (Playwright)
    # Pinned: ubuntu-latest moved to 26.04, where `playwright install chromium`
    # fails with "Playwright does not support chromium on ubuntu26.04-x64".
    # Return to ubuntu-latest once the installed Playwright supports 26.04.
    runs-on: ubuntu-24.04
    # On a push to main, deploy-functions runs too; wait for it so E2E exercises
    # the freshly-deployed edge functions instead of racing the redeploy (which
    # left vault-save-creative cold/mid-swap and timed the save flow out). On
    # PRs deploy-functions is skipped (it is gated to main pushes), so the
    # always() guard keeps E2E running there as long as `check` passed.
    needs: [check, deploy-functions]
    # Never runs for the staging branch: its secrets point at production.
    if: ${{ always() && needs.check.result == 'success' && github.ref != 'refs/heads/staging' && github.base_ref != 'staging' }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      PLAYWRIGHT_CLIENT_EMAIL: ${{ secrets.PLAYWRIGHT_CLIENT_EMAIL }}
      PLAYWRIGHT_CLIENT_PASSWORD: ${{ secrets.PLAYWRIGHT_CLIENT_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require authenticated E2E configuration
        run: npm run check:e2e-env

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build:check

      - name: Start preview server
        run: npx vite preview --port 8080 &
        # Give the server a moment to bind before Playwright connects
        # Playwright's built-in webServer config handles this more robustly,
        # but the preview server is fast enough that a short sleep suffices.

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Dump failure DOM snapshots
        if: failure()
        run: |
          echo "===== Playwright failure diagnostics ====="
          shopt -s globstar nullglob
          found=0
          for f in test-results/**/error-context.md; do
            found=1
            echo ""
            echo "----- $f -----"
            cat "$f"
          done
          if [ "$found" = "0" ]; then
            echo "No error-context.md files found under test-results/"
            echo "test-results/ tree:"
            ls -R test-results/ 2>/dev/null || echo "(test-results/ missing)"
          fi
          echo "===== End diagnostics ====="

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-functions:
    name: Deploy Supabase edge functions
    runs-on: ubuntu-latest
    needs: [check, deno-test, database-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration-warning step can diff the push range.
          fetch-depth: 0

      - name: Warn if migrations changed (CI does not deploy them)
        # Never fails the build — purely an annotation reminding the operator
        # that supabase/migrations/ are applied manually via `supabase db push`.
        # Production migrations stay manual until the prod migration ledger is
        # reconciled (it has phantom entries); CI must never run db push.
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          elif git rev-parse -q --verify 'HEAD^' >/dev/null 2>&1; then
            # Fallback (force push / missing before-sha): compare the last commit.
            RANGE="HEAD^..HEAD"
          else
            # First push to the branch — nothing to diff against.
            echo "No previous commit to diff against; skipping migration check."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$RANGE" -- supabase/migrations/ || true)"
          if [ -n "$CHANGED" ]; then
            echo "::warning::Migration files changed in this push — Supabase migrations are NOT deployed by CI. Run 'supabase db push' manually."
            echo "Changed migration files ($RANGE):"
            echo "$CHANGED"
          else
            echo "No migration changes in $RANGE."
          fi
          exit 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: bash scripts/deploy-functions.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Smoke test deployed edge functions
        run: bash scripts/smoke-test.sh
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

  # Staging release job. Mirrors deploy-functions but targets the staging
  # Supabase project only. It reads STAGING_* secrets exclusively and never
  # references a production secret, and it refuses to run if the staging project
  # id is empty or equals the production project id. See docs/staging.md.
  deploy-staging:
    name: Deploy database & edge functions to STAGING
    runs-on: ubuntu-latest
    needs: [check, deno-test, database-test]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Refuse to run against production
        run: |
          PROD_REF="gwyxaqoaldnaavkjqquv"
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_URL" ]; then
            echo "A STAGING_SUPABASE_* secret is missing. Stopping." >&2
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" = "$PROD_REF" ] || printf '%s' "$SUPABASE_URL" | grep -q "$PROD_REF"; then
            echo "Staging secrets point at the production project. Stopping." >&2
            exit 1
          fi
          case "$SUPABASE_URL" in
            "https://$SUPABASE_PROJECT_ID.supabase.co") ;;
            *) echo "STAGING_SUPABASE_URL does not match STAGING_SUPABASE_PROJECT_ID. Stopping." >&2; exit 1 ;;
          esac

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push --linked --include-all --yes

      # Migrations schedule cron jobs and hard-code the production function URL.
      # This step removes every cron job and rewrites production URLs to the
      # staging project, then fails the run if any production reference is left.
      - name: Lock down staging (cron off, no production URLs)
        run: |
          sed "s/__STAGING_REF__/$SUPABASE_PROJECT_ID/g" scripts/staging-lockdown.sql > /tmp/staging-lockdown.sql
          supabase db query --linked -f /tmp/staging-lockdown.sql

      - name: Deploy all edge functions
        run: bash scripts/deploy-functions.sh

      - name: Smoke test deployed edge functions
        run: bash scripts/smoke-test.sh
