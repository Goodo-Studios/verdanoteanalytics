<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Declared explicitly so the .ico is an intentional fallback, not just the
         path browsers and crawlers probe by convention. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- PWA: installable to a phone home screen (Android share target + iOS quick-add) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f9f7f3" />
    <!-- iOS ignores the manifest entirely; these are the Safari equivalents. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Goodo OS" />

    <!-- Fonts are served from /fonts (src/styles/goodo-os-fonts.css). The CSP blocks Google Fonts. -->
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Goodo OS</title>
    <meta name="description" content="Analyze, tag, and optimize your Meta ad creatives with win rate analysis, kill/scale recommendations, and AI-powered insights.">
    <meta name="author" content="Verdanote" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta property="og:title" content="Verdanote Creative Analytics">
  <meta name="twitter:title" content="Verdanote Creative Analytics">
  <meta property="og:description" content="Analyze, tag, and optimize your Meta ad creatives with win rate analysis, kill/scale recommendations, and AI-powered insights.">
  <meta name="twitter:description" content="Analyze, tag, and optimize your Meta ad creatives with win rate analysis, kill/scale recommendations, and AI-powered insights.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
